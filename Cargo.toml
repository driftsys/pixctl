[package]
name = "pixctl"
version = "0.0.1"
edition = "2021"
description = "Hermetic CLI that fits raster images for Markdown docs (PNG/WebP, display gate)"
license = "MIT"
repository = "https://github.com/driftsys/pixctl"
readme = "README.md"
keywords = ["cli", "image", "png", "markdown", "documentation"]
categories = ["command-line-utilities"]
exclude = ["tests/fonts"]

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
image = "0.25"
imageproc = "0.27"
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
ab_glyph = "0.2"
assert_cmd = "2"
predicates = "3"
tempfile = "3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
