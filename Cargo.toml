[package]
name = "pixctl"
version = "0.0.1"
edition = "2021"
description = "Hermetic CLI that fits raster images for Markdown docs (PNG/WebP, display gate)"
license = "MIT"
repository = "https://github.com/driftsys/pixctl"
readme = "README.md"
keywords = ["cli", "image", "png", "markdown", "documentation"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
